<!doctype html>
<html lang="ar" dir="rtl">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8926612269781002" crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعيين كلمة مرور جديدة | قصص وحكايات الليل</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,"Noto Sans Arabic",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:min(480px,100%);background:#181818;border:1px solid #2d2d2d;border-radius:16px;padding:24px;box-shadow:0 12px 40px #0008}
h1{font-size:24px;margin:0 0 10px}
p{color:#aaa;line-height:1.8}
label{display:block;margin:16px 0 7px;color:#ccc}
input{width:100%;padding:13px;background:#101010;border:1px solid #3a3a3a;color:#fff;border-radius:9px}
button{width:100%;margin-top:18px;background:#f1c64a;color:#111;border:0;padding:13px 20px;border-radius:9px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6}
.msg{padding:12px;border-radius:9px;margin-top:14px;background:#252525;line-height:1.7}
.ok{border:1px solid #315c3a}.err{border:1px solid #713939}
a{color:#f1c64a}
.hidden{display:none}
</style>
</head>
<body>
<main class="box">
<h1>تعيين كلمة مرور جديدة</h1>
<p id="intro">اكتبي كلمة المرور الجديدة لحساب لوحة الإدارة.</p>
<section id="form">
<label for="password">كلمة المرور الجديدة</label>
<input id="password" type="password" autocomplete="new-password" placeholder="كلمة المرور الجديدة">
<label for="password2">تأكيد كلمة المرور</label>
<input id="password2" type="password" autocomplete="new-password" placeholder="أعيدي كتابة كلمة المرور">
<button id="save">حفظ كلمة المرور</button>
</section>
<div id="msg" class="msg hidden"></div>
<p><a href="admin.html">العودة إلى تسجيل الدخول</a></p>
</main>
<script>
document.getElementById('intro').textContent='استعادة كلمة المرور عبر Supabase متوقفة في هذه النسخة. استخدمي رمز الإدارة المكوّن من 5 أرقام من صفحة لوحة الإدارة.';
document.getElementById('form').classList.add('hidden');
document.getElementById('msg').textContent='هذه الصفحة لا تتصل بقاعدة بيانات أو بخدمة استعادة كلمات المرور.';
document.getElementById('msg').className='msg';
</script>
</body>
</html>
