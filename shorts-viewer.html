<!doctype html>
<html lang="ar" dir="rtl">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8926612269781002" crossorigin="anonymous"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shorts - قصص وحكايات الليل</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,"Noto Sans Arabic",sans-serif;overflow:hidden}button{font:inherit}.viewer{position:relative;width:100%;height:100dvh;max-width:560px;margin:auto;background:#000;overflow:hidden}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.short{height:100dvh;position:relative;scroll-snap-align:start;background:#000;overflow:hidden}.media{position:absolute;inset:0;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center}.media video{width:100%;height:100%;object-fit:cover;background:#000;display:block}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 18%,transparent 60%,rgba(0,0,0,.7));z-index:2}.topbar{position:absolute;top:0;left:0;right:0;height:74px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;justify-content:space-between;z-index:8}.topbar b{font-size:20px;text-shadow:0 2px 5px #000}.top-actions{display:flex;gap:8px}.icon-btn{width:42px;height:42px;border:0;border-radius:50%;background:#0008;color:#fff;display:grid;place-items:center;font-size:23px;cursor:pointer}.icon-btn:active{transform:scale(.94)}.right-actions{position:absolute;left:10px;bottom:165px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:7}.action{border:0;background:none;color:#fff;text-shadow:0 2px 6px #000;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:48px}.action .ico{width:46px;height:46px;border-radius:50%;background:#0005;display:grid;place-items:center;font-size:28px;line-height:1}.action small{font-size:12px;font-weight:700;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.action .lucide{width:25px;height:25px}.short-info-panel{position:absolute;right:16px;left:82px;bottom:110px;max-height:42dvh;overflow:auto;background:#171717eF;border:1px solid #444;border-radius:16px;padding:15px;z-index:18;display:none;box-shadow:0 12px 35px #000b}.short-info-panel.open{display:block}.short-info-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.short-info-head b{font-size:17px}.short-info-close{width:34px;height:34px;border:0;border-radius:50%;background:#2a2a2a;color:#fff;display:grid;place-items:center}.short-info-date{color:#bbb;font-size:12px;margin-bottom:10px}.short-info-desc{white-space:pre-wrap;color:#eee;font-size:14px;line-height:1.7}.related-short{margin-top:12px;background:#181818;border:1px solid #444;border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.related-short img{width:112px;height:63px;object-fit:cover;border-radius:9px;flex:none}.related-short-info{min-width:0}.related-short-label{color:#f5c84b;font-size:11px;font-weight:800;margin-bottom:4px}.related-short-title{font-size:13px;font-weight:800;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bottom{position:absolute;right:16px;left:82px;bottom:24px;z-index:7;text-shadow:0 2px 7px #000}.channel-line{display:flex;align-items:center;gap:9px;margin-bottom:9px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#222;border:2px solid #fff;flex:none;display:block}.channel-name{font-weight:800;font-size:16px;color:#fff;text-decoration:none;white-space:nowrap}.desc{font-size:15px;line-height:1.5;font-weight:700;max-width:95%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.view-line{display:none}.progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:#ffffff55;z-index:9}.progress i{display:block;width:0;height:100%;background:#fff}.center-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border:0;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:30px;z-index:6;cursor:pointer;opacity:0;transition:.18s}.short.paused .center-play{opacity:1}.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;border:4px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;z-index:6}.short.ready .loading{display:none}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}.empty{height:100%;display:grid;place-items:center;color:#ddd;padding:30px;text-align:center}.comments-panel{position:absolute;left:0;right:0;bottom:0;height:min(62dvh,560px);background:#171717;border-radius:18px 18px 0 0;z-index:20;transform:translateY(105%);transition:.25s;display:flex;flex-direction:column;box-shadow:0 -10px 35px #000b}.comments-panel.open{transform:translateY(0)}.comments-head{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #333}.comments-list{flex:1;overflow:auto;padding:15px}.comment{padding:10px 0;border-bottom:1px solid #292929;line-height:1.6;display:flex;align-items:flex-start;gap:8px}.comment-body{flex:1;min-width:0}.comment-meta{font-size:12px;color:#aaa;margin-bottom:2px}.comment-text{word-break:break-word}.comment-delete{border:0;background:none;color:#aaa;padding:4px 6px;cursor:pointer;font-size:13px}.comment-delete:hover{color:#fff}.comment-form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #333}.comment-form input{flex:1;background:#262626;border:1px solid #444;color:#fff;border-radius:22px;padding:10px 14px;outline:none}.comment-form button{border:0;background:#fff;color:#111;border-radius:22px;padding:0 15px;font-weight:700}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;border:1px solid #444;color:#fff;padding:10px 15px;border-radius:10px;z-index:50;display:none}.toast.show{display:block}
@media(min-width:561px){body{background:#080808}.viewer{box-shadow:0 0 40px #000}}
@media(max-width:560px){.topbar{height:66px}.right-actions{left:7px;bottom:145px;gap:14px}.bottom{right:16px;left:82px;bottom:20px}.desc{font-size:14px}.avatar{width:36px;height:36px}.action .ico{width:42px;height:42px;font-size:26px}.center-play{width:64px;height:64px}}
.comments-panel{display:none!important}

.short-view-more{position:relative}
.short-view-more-btn{width:42px;height:42px;border:0;border-radius:50%;background:#0008;color:#fff;font-size:25px;display:grid;place-items:center;cursor:pointer}
.short-view-menu{position:absolute;top:48px;right:0;min-width:185px;background:#202020;border:1px solid #3b3b3b;border-radius:10px;box-shadow:0 10px 28px #000b;overflow:hidden;display:none;z-index:50}
.short-view-menu.open{display:block}
.short-view-menu button{display:block;width:100%;text-align:right;background:none;border:0;color:#eee;padding:12px 14px;cursor:pointer;font:inherit}
.short-view-menu button:hover{background:#303030}
.short-view-menu .danger-item{color:#ff8d8d}
</style>
</head>
<body>
<div class="viewer"><div class="feed" id="feed"><div class="empty">جاري تحميل الـShorts...</div></div></div>
<div id="toast" class="toast"></div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>

const feed=document.getElementById('feed');
const requestedId=new URLSearchParams(location.search).get('id');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R2_PUBLIC_BASE='https://pub-025c138d90ed4d4bb9d231b4589a28bb.r2.dev';async function fetchCatalog(){const r=await fetch('https://qisas-r2-api.layali-7kayat-719.workers.dev?action=catalog',{cache:'no-store'});if(!r.ok)throw new Error('تعذر تحميل فهرس القصص من R2');return await r.json()};const publicUrl=(bucket,path)=>{if(!path)return '';if(String(path).startsWith('r2:'))return R2_PUBLIC_BASE+'/'+String(path).slice(3).split('/').map(encodeURIComponent).join('/');return null};
const fmtTime=s=>{s=Math.max(0,Math.floor(Number(s)||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let activeVideo=null, observer=null, counted=new Set();

async function loadShorts(){try{const catalog=await fetchCatalog();const data=(catalog.videos||[]).filter(v=>v.status==='published'&&v.is_short).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));if(!data.length){feed.innerHTML='<div class="empty">لا توجد Shorts منشورة بعد.</div>';return;}let list=[...data];if(requestedId){const idx=list.findIndex(v=>String(v.id)===String(requestedId));if(idx>0){const [x]=list.splice(idx,1);list.unshift(x)}}feed.innerHTML=list.map((v,i)=>card(v,i)).join('');document.querySelectorAll('.short').forEach(setupCard);const first=document.querySelector('.short');if(first)first.scrollIntoView({block:'start'});setupObserver();loadRelatedThumbnails();if(window.lucide)lucide.createIcons()}catch(error){feed.innerHTML='<div class="empty">تعذر تحميل الـShorts. حاول مرة أخرى لاحقًا.</div>';console.warn(error)}}
function formatShortDate(value){if(!value)return '';return new Intl.DateTimeFormat('ar-OM',{year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Muscat'}).format(new Date(value));}
function card(v,i){
 const video=publicUrl('videos',v.video_path), poster=publicUrl('thumbnails',v.thumbnail_path);
 return `<section class="short paused" data-id="${esc(v.id)}" data-video="${esc(video)}" data-index="${i}">
   <div class="media"><video oncontextmenu="return false" disablepictureinpicture controlsList="nodownload noplaybackrate" preload="metadata" playsinline poster="${esc(poster)}" src="${esc(video)}"></video></div><div class="shade"></div><div class="loading"></div>
   <div class="topbar"><button class="icon-btn" aria-label="رجوع" onclick="history.back()">←</button><b>Shorts</b><div class="top-actions"><div class="short-view-more"><button class="short-view-more-btn" onclick="openShortViewerMenu(this,event)" aria-label="المزيد">⋮</button><div class="short-view-menu" onclick="event.stopPropagation()"><span class="short-view-admin-actions"></span><button onclick="shareCurrentShort()">↗ مشاركة الفيديو</button></div></div><button class="icon-btn" aria-label="إغلاق" onclick="history.back()">×</button></div></div>
   <div class="right-actions">
     <button class="action" onclick="openShortInfo(this)" aria-label="فتح وصف القصة"><span class="ico"><i data-lucide="file-text"></i></span><small>وصف القصة</small></button>
     <button class="action" onclick="shareShort(this)"><span class="ico">↗</span><small>مشاركة</small></button>
   </div>
   <button class="center-play" aria-label="تشغيل">▶</button>
   <div class="bottom"><div class="channel-line"><a href="index.html" aria-label="قصص وحكايات الليل"><img class="avatar" src="channel-avatar.png" alt="افتار قناة قصص وحكايات الليل"></a><a class="channel-name" href="index.html">قصص وحكايات الليل</a></div><div class="desc">${esc(v.title)}</div>${v.related_video_id?`<a class="related-short" href="watch.html?id=${encodeURIComponent(v.related_video_id)}"><img src="related-placeholder" data-related-id="${esc(v.related_video_id)}" alt=""><div class="related-short-info"><div class="related-short-label">القصة الكاملة</div><div class="related-short-title">مشاهدة الفيديو المرتبط</div></div></a>`:''}</div>
   <div class="short-info-panel"><div class="short-info-head"><b>وصف القصة</b><button class="short-info-close" onclick="closeShortInfo(this)" aria-label="إغلاق">×</button></div><div class="short-info-date">تاريخ الإضافة: ${esc(formatShortDate(v.created_at))}</div><div class="short-info-desc">${esc(v.description||v.title||'لا يوجد وصف لهذه القصة.')}</div></div>
   <div class="progress"><i></i></div>
 </section>`;
}
function openShortInfo(button){const section=button.closest('.short');section.querySelector('.short-info-panel')?.classList.add('open');}
function closeShortInfo(button){button.closest('.short-info-panel')?.classList.remove('open');}
async function loadRelatedThumbnails(){try{const catalog=await fetchCatalog();const ids=[...document.querySelectorAll('[data-related-id]')].map(x=>x.dataset.relatedId).filter(Boolean);(catalog.videos||[]).filter(v=>ids.includes(String(v.id))&&v.status==='published').forEach(v=>{document.querySelectorAll(`[data-related-id="${CSS.escape(String(v.id))}"]`).forEach(img=>{img.src=publicUrl('thumbnails',v.thumbnail_path)||'featured.svg';img.alt=v.title||'القصة المرتبطة'})})}catch(e){console.warn(e)}}

function isAdmin(){return !!sessionStorage.getItem('admin_pin_value')}
function openShortViewerMenu(btn,e){
  e?.preventDefault();e?.stopPropagation();
  document.querySelectorAll('.short-view-menu.open').forEach(x=>x.classList.remove('open'));
  btn.parentElement.querySelector('.short-view-menu').classList.add('open');
}
document.addEventListener('click',()=>document.querySelectorAll('.short-view-menu.open').forEach(x=>x.classList.remove('open')));
function shareCurrentShort(){
  const section=document.querySelector('.short');
  const id=section?.dataset.id||'';
  const title=section?.querySelector('.desc')?.textContent||'Shorts';
  const url=new URL('shorts-viewer.html?id='+encodeURIComponent(id),location.href).href;
  if(navigator.share)navigator.share({title,url}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>showToast('تم نسخ رابط الفيديو')).catch(()=>{});
}
function renderShortViewerAdmin(section){
  const box=section?.querySelector('.short-view-admin-actions');if(!box)return;
  box.innerHTML='';
  if(!isAdmin())return;
  const id=section.dataset.id||'';
  box.innerHTML=`<button onclick="location.href='admin.html?edit=${encodeURIComponent(id)}'">✏️ تعديل</button><button class="danger-item" onclick="deleteShortViewer('${id}',event)">🗑️ حذف</button>`;
}
async function deleteShortViewer(id,e){
  e?.preventDefault();e?.stopPropagation();
  const pin=sessionStorage.getItem('admin_pin_value');
  if(!pin){location.href='admin.html';return}
  if(!confirm('هل تريدين حذف هذا الـShort نهائيًا؟'))return;
  try{const r=await fetch('https://qisas-r2-api.layali-7kayat-719.workers.dev',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin,action:'delete',id})});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.error||'تعذر الحذف');location.href='shorts.html'}catch(err){showToast('فشل الحذف: '+err.message)}
}
function setupCard(section){
 renderShortViewerAdmin(section);
 const video=section.querySelector('video');
 const play=section.querySelector('.center-play');
 video.addEventListener('loadeddata',()=>section.classList.add('ready'),{once:true});
 video.addEventListener('canplay',()=>section.classList.add('ready'),{once:true});
 video.volume=1;
 video.addEventListener('play',()=>{section.classList.remove('paused');countView(section);activeVideo=video});
 video.addEventListener('pause',()=>section.classList.add('paused'));
 video.addEventListener('timeupdate',()=>{const p=section.querySelector('.progress i');if(p&&video.duration)p.style.width=((video.currentTime/video.duration)*100)+'%'});
 video.addEventListener('ended',()=>{section.classList.add('paused');nextShort(section)});
 play.addEventListener('click',()=>togglePlay(video));
 video.addEventListener('click',()=>togglePlay(video));
}
function togglePlay(video){if(video.paused){video.muted=false;video.volume=1;video.play().catch(()=>{showToast('اضغط تشغيل لسماع صوت الفيديو')})}else video.pause()}
async function countView(section){const id=section.dataset.id;if(counted.has(id))return;counted.add(id)}
function getAdminPin(){return sessionStorage.getItem('admin_pin_value')||''}
function openComments(){showToast('التعليقات متوقفة مؤقتًا')}
async function shareShort(btn){const section=btn.closest('.short');const url=location.origin+location.pathname+'?id='+encodeURIComponent(section.dataset.id);const title=section.querySelector('.desc')?.textContent||'Short';try{if(navigator.share){await navigator.share({title,url})}else{await navigator.clipboard.writeText(url);showToast('تم نسخ رابط الـShort')}}catch(e){}}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
loadShorts();
</script>

<script>
document.addEventListener('contextmenu',function(e){
  if(e.target && e.target.closest && e.target.closest('video')) e.preventDefault();
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey) && (e.key==='s'||e.key==='S') && e.target && e.target.closest && e.target.closest('video')){
    e.preventDefault();
  }
});
document.querySelectorAll('video').forEach(function(v){
  v.setAttribute('controlsList','nodownload noplaybackrate');
  v.setAttribute('disablepictureinpicture','');
  v.addEventListener('contextmenu',function(e){e.preventDefault();});
});

const _videoGuard=new MutationObserver(function(){
  document.querySelectorAll('video').forEach(function(v){
    v.setAttribute('controlsList','nodownload noplaybackrate');
    v.setAttribute('disablepictureinpicture','');
    v.addEventListener('contextmenu',function(e){e.preventDefault();},{once:true});
  });
});
_videoGuard.observe(document.documentElement,{childList:true,subtree:true});
</script>
</body></html>
