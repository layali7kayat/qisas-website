<script>

function openSidebar(){document.getElementById('sideDrawer')?.classList.add('open');document.getElementById('drawerOverlay')?.classList.add('open')}function closeSidebar(){document.getElementById('sideDrawer')?.classList.remove('open');document.getElementById('drawerOverlay')?.classList.remove('open')}const R2_PUBLIC_BASE='https://pub-025c138d90ed4d4bb9d231b4589a28bb.r2.dev';async function fetchCatalog(){const r=await fetch('https://qisas-r2-api.layali-7kayat-719.workers.dev?action=catalog',{cache:'no-store'});if(!r.ok)throw new Error('تعذر تحميل فهرس القصص من R2');return await r.json()};function publicUrl(bucket,path){if(!path)return null;if(String(path).startsWith('r2:'))return R2_PUBLIC_BASE+'/'+String(path).slice(3).split('/').map(encodeURIComponent).join('/');return null}function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function formatViews(n){return (Number(n)||0).toLocaleString('en-US')+' مشاهدة'}

function formatDuration(sec){if(!isFinite(sec)||sec<=0)return '—';sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function fillRelatedDurations(){document.querySelectorAll('[data-related-video-url]').forEach(el=>{const v=document.createElement('video');v.preload='metadata';v.src=el.dataset.relatedVideoUrl;v.addEventListener('loadedmetadata',()=>{el.textContent=formatDuration(v.duration);v.removeAttribute('src');v.load()},{once:true})})}
const id=new URLSearchParams(location.search).get('id');const titleParam=new URLSearchParams(location.search).get('title');
let currentVideoId=null;let currentViews=0;let viewCounted=false;
async function countView(){}
async function load(){try{const catalog=await fetchCatalog();let v;if(id)v=(catalog.videos||[]).find(x=>String(x.id)===String(id)&&x.status==='published');else if(titleParam)v=(catalog.videos||[]).find(x=>x.title===titleParam&&x.status==='published');else v=(catalog.videos||[]).find(x=>x.status==='published');if(!v){document.getElementById('title').textContent='الفيديو غير موجود';return}currentVideoId=v.id;currentViews=Number(v.views)||0;document.title=v.title+' | قصص وحكايات الليل';document.getElementById('title').textContent=v.title;document.getElementById('meta').textContent='قصص وحكايات الليل • '+formatViews(currentViews);const storyDescription=String(v.description||'').trim()||'شاهد هذه القصة كاملة على موقع قصص وحكايات الليل.';document.getElementById('description').textContent=storyDescription;document.getElementById('description').classList.remove('open');const player=document.getElementById('videoPlayer');const poster=publicUrl('thumbnails',v.thumbnail_path)||'featured.svg';const posterEl=document.getElementById('videoPoster');const playButton=document.getElementById('playButton');posterEl.src=poster;player.poster=poster;playButton.onclick=async()=>{const url=publicUrl('videos',v.video_path);if(!url){alert('ملف الفيديو لم يُنقل إلى R2 بعد.');return}player.src=url;posterEl.style.display='none';playButton.style.display='none';player.style.display='block';try{await player.play()}catch(e){console.warn('play error',e)}};const others=(catalog.videos||[]).filter(o=>o.status==='published'&&!o.is_short&&String(o.id)!==String(v.id));const randomOthers=others.sort(()=>Math.random()-0.5).slice(0,6);document.getElementById('relatedList').innerHTML=randomOthers.map(o=>`<a class="related-card" href="watch.html?id=${encodeURIComponent(o.id)}"><div class="related-thumb"><img src="${publicUrl('thumbnails',o.thumbnail_path)||'featured.svg'}" alt=""><span class="related-duration" data-related-video-url="${publicUrl('videos',o.video_path)||''}">…</span></div><div class="related-info"><div class="related-title">${esc(o.title)}</div><div class="related-channel"><img class="related-avatar" src="channel-avatar.png" alt=""><span>قصص وحكايات الليل</span><span class="related-dot">•</span><span>${formatViews(o.views)}</span></div></div></a>`).join('');fillRelatedDurations()}catch(e){document.getElementById('title').textContent='تعذر تحميل القصة. حاول مرة أخرى لاحقًا.';console.warn(e)}}
load();function toggleDesc(){document.getElementById('description')?.classList.toggle('open')}async function shareVideo(){try{await navigator.share({title:document.getElementById('title').textContent,url:location.href})}catch(e){if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>alert('تم نسخ رابط الفيديو')).catch(()=>{});}}

</script>

<script>
document.addEventListener('contextmenu',function(e){
  if(e.target && e.target.closest && e.target.closest('video')) e.preventDefault();
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey) && (e.key==='s'||e.key==='S') && e.target && e.target.closest && e.target.closest('video')){
    e.preventDefault();
  }
});
document.querySelectorAll('video').forEach(function(v){
  v.setAttribute('controlsList','nodownload noplaybackrate');
  v.setAttribute('disablepictureinpicture','');
  v.addEventListener('contextmenu',function(e){e.preventDefault();});
});

const _videoGuard=new MutationObserver(function(){
  document.querySelectorAll('video').forEach(function(v){
    v.setAttribute('controlsList','nodownload noplaybackrate');
    v.setAttribute('disablepictureinpicture','');
    v.addEventListener('contextmenu',function(e){e.preventDefault();},{once:true});
  });
});
_videoGuard.observe(document.documentElement,{childList:true,subtree:true});
</script>
