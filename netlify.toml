
# ==========================================
# Qisas Wa Hikayat Al-Layl - V16
# Netlify Configuration
# ==========================================

[build]
  publish = "dist"

# ------------------------------------------
# إعدادات الخادم
# ------------------------------------------

[build.environment]
  NODE_VERSION = "20"

# ------------------------------------------
# توجيه الروابط إلى التطبيق
# مناسب لتطبيقات SPA المبنية على React
# ------------------------------------------

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------
# تخزين ملفات الموقع مؤقتًا
# ------------------------------------------

[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ------------------------------------------
# إعدادات ملف HTML الرئيسي
# ------------------------------------------

[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ------------------------------------------
# حماية أساسية للمتصفح
# ------------------------------------------

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
