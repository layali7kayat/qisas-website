<script>

function openSidebar(){document.getElementById("sideDrawer")?.classList.add("open");document.getElementById("drawerOverlay")?.classList.add("open");document.body.classList.add("drawer-open")}
function closeSidebar(){document.getElementById("sideDrawer")?.classList.remove("open");document.getElementById("drawerOverlay")?.classList.remove("open");document.body.classList.remove("drawer-open")}
const R2_PUBLIC_BASE='https://pub-025c138d90ed4d4bb9d231b4589a28bb.r2.dev';async function fetchCatalog(){const r=await fetch('https://qisas-r2-api.layali-7kayat-719.workers.dev?action=catalog',{cache:'no-store'});if(!r.ok)throw new Error('تعذر تحميل فهرس القصص من R2');return await r.json()};function publicUrl(bucket,path){if(!path)return null;if(String(path).startsWith('r2:'))return R2_PUBLIC_BASE+'/'+String(path).slice(3).split('/').map(encodeURIComponent).join('/');return null}
function formatViews(n){return (Number(n)||0).toLocaleString('en-US')+' مشاهدة'}
function formatDate(s){const d=new Date(s);const diff=Math.max(0,Date.now()-d.getTime());const m=Math.floor(diff/60000),h=Math.floor(m/60),day=Math.floor(h/24);if(m<60)return 'قبل '+Math.max(1,m)+' دقيقة';if(h<24)return 'قبل '+h+' ساعة';if(day<7)return 'قبل '+day+' أيام';if(day<30)return 'قبل '+Math.floor(day/7)+' أسابيع';return 'قبل '+Math.floor(day/30)+' شهر'}
function row(v){const img=publicUrl('thumbnails',v.thumbnail_path)||'featured.svg';const vu=publicUrl('videos',v.video_path)||'';return `<div class="video-row"><a href="watch.html?id=${encodeURIComponent(v.id)}" class="thumb-link"><div class="thumb"><img src="${img}" alt=""><span class="duration" data-duration data-video-url="${vu}">…</span></div></a><div><a href="watch.html?id=${encodeURIComponent(v.id)}"><div class="vtitle">${escapeHtml(v.title)}</div><div class="meta">${formatViews(v.views)} • ${formatDate(v.created_at)}</div></a></div>${actionMenu(v)}</div>`}
function escapeHtml(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
let interestTimer=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function interestCard(v){const img=publicUrl('thumbnails',v.thumbnail_path)||'featured.svg';const vu=publicUrl('videos',v.video_path)||'';return `<a class="interest-card" href="watch.html?id=${encodeURIComponent(v.id)}"><div class="thumb"><img src="${img}" alt=""><span class="duration" data-video-url="${vu}">…</span></div><div class="card-body"><div class="vtitle">${escapeHtml(v.title)}</div><div class="meta">${formatViews(v.views)} • ${formatDate(v.created_at)}</div></div></a>`}
async function loadInterest(){const el=document.getElementById('interestList');if(!el)return;try{const catalog=await fetchCatalog();const data=(catalog.videos||[]).filter(v=>v.status==='published'&&!v.is_short);if(!data.length){el.innerHTML='';return}const list=shuffle(data).slice(0,Math.min(8,data.length));el.innerHTML=list.map(interestCard).join('');fillDurations(el);if(interestTimer)clearInterval(interestTimer);interestTimer=setInterval(()=>{const card=el.querySelector('.interest-card');if(!card)return;el.scrollBy({left:document.documentElement.dir==='rtl'?-230:230,behavior:'smooth'});setTimeout(()=>{const current=el.querySelector('.interest-card');if(current){el.appendChild(current);el.scrollLeft=0}},1100)},4500)}catch(e){el.innerHTML='';console.warn(e)}}
function scrollInterest(dir){const el=document.getElementById('interestList');if(el)el.scrollBy({left:dir*260,behavior:'smooth'})}
async function loadFeatured(){const box=document.getElementById('featured');if(!box)return;try{const catalog=await fetchCatalog();const id=catalog.featured_video_id;const v=(catalog.videos||[]).find(x=>String(x.id)===String(id)&&x.status==='published');if(!v){box.hidden=true;return}document.getElementById('featuredLink').href='watch.html?id='+encodeURIComponent(v.id);document.getElementById('featuredImg').src=publicUrl('thumbnails',v.thumbnail_path)||'featured.svg';document.getElementById('featuredTitle').textContent=v.title||'';document.getElementById('featuredMeta').textContent=formatViews(v.views)+' • '+formatDate(v.created_at);box.hidden=false;const d=document.getElementById('featuredDuration');const vu=publicUrl('videos',v.video_path);if(vu){const vid=document.createElement('video');vid.preload='metadata';vid.src=vu;vid.addEventListener('loadedmetadata',()=>{d.textContent=durationText(vid.duration);vid.removeAttribute('src');vid.load()},{once:true})}}catch(e){box.hidden=true;console.warn(e)}}

async function loadVideos(){const list=document.getElementById('videoList');list.innerHTML='<div class="meta" style="padding:20px">جاري تحميل الفيديوهات...</div>';try{const catalog=await fetchCatalog();const data=(catalog.videos||[]).filter(v=>v.status==='published'&&!v.is_short).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0)).slice(0,6);if(!data.length){list.innerHTML='<div class="meta" style="padding:20px">لا توجد فيديوهات منشورة بعد</div>';return}list.innerHTML=data.map(row).join('');fillDurations(list)}catch(error){list.innerHTML='<div class="meta" style="padding:20px">تعذر تحميل الفيديوهات</div>';console.error(error)}}
loadFeatured();loadVideos();loadInterest();

function toast(text){const old=document.querySelector('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=text;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function savePlaylist(v){let a=[];try{a=JSON.parse(localStorage.getItem('qisas_saved_playlist')||'[]')}catch(e){};if(!a.some(x=>x.id===v.id)){a.push(v);localStorage.setItem('qisas_saved_playlist',JSON.stringify(a));toast('تم حفظ القصة في قائمة التشغيل')}else toast('القصة محفوظة بالفعل')}
function openMenu(btn,e){e.preventDefault();e.stopPropagation();document.querySelectorAll('.video-menu.open').forEach(x=>x.classList.remove('open'));btn.parentElement.querySelector('.video-menu').classList.add('open')}
document.addEventListener('click',()=>document.querySelectorAll('.video-menu.open').forEach(x=>x.classList.remove('open')));
function isAdmin(){return !!sessionStorage.getItem('admin_pin_value')}
function shareItem(id,title,event){event?.preventDefault();event?.stopPropagation();const url=new URL('watch.html?id='+encodeURIComponent(id),location.href).href;if(navigator.share){navigator.share({title:title||'قصص وحكايات الليل',url}).catch(()=>{});}else if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>toast('تم نسخ رابط الفيديو')).catch(()=>toast('رابط الفيديو: '+url));}else toast('رابط الفيديو: '+url)}
function actionMenu(v){const admin=isAdmin();return `<div class="more-wrap"><button class="more" onclick="openMenu(this,event)" aria-label="المزيد">⋮</button><div class="video-menu" onclick="event.stopPropagation()">${admin?`<button onclick="location.href='admin.html?edit=${encodeURIComponent(v.id)}'">✏️ تعديل</button><button class="danger-item" onclick="deleteFromList('${v.id}')">🗑️ حذف</button>`:''}<button onclick="shareItem('${v.id}',${JSON.stringify(v.title||'')},event)">↗ مشاركة الفيديو</button></div></div>`}
async function deleteFromList(id){if(!confirm('هل تريدين حذف هذه القصة نهائيًا؟'))return;const pin=sessionStorage.getItem('admin_pin_value');if(!pin){location.href='admin.html';return}try{const r=await fetch('https://qisas-r2-api.layali-7kayat-719.workers.dev',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin,action:'delete',id})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw new Error(j.error||'تعذر الحذف');toast('تم حذف القصة');location.reload()}catch(e){toast('فشل الحذف: '+e.message)}}
function durationText(sec){if(!isFinite(sec)||sec<=0)return '—';sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function fillDurations(scope=document){scope.querySelectorAll('.duration[data-video-url]').forEach(el=>{const v=document.createElement('video');v.preload='metadata';v.src=el.dataset.videoUrl;v.addEventListener('loadedmetadata',()=>{el.textContent=durationText(v.duration);v.removeAttribute('src');v.load()},{once:true});v.addEventListener('error',()=>{el.textContent='';},{once:true});});}
</script>

<script>
document.addEventListener('contextmenu',function(e){
  if(e.target && e.target.closest && e.target.closest('video')) e.preventDefault();
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey) && (e.key==='s'||e.key==='S') && e.target && e.target.closest && e.target.closest('video')){
    e.preventDefault();
  }
});
document.querySelectorAll('video').forEach(function(v){
  v.setAttribute('controlsList','nodownload noplaybackrate');
  v.setAttribute('disablepictureinpicture','');
  v.addEventListener('contextmenu',function(e){e.preventDefault();});
});

const _videoGuard=new MutationObserver(function(){
  document.querySelectorAll('video').forEach(function(v){
    v.setAttribute('controlsList','nodownload noplaybackrate');
    v.setAttribute('disablepictureinpicture','');
    v.addEventListener('contextmenu',function(e){e.preventDefault();},{once:true});
  });
});
_videoGuard.observe(document.documentElement,{childList:true,subtree:true});
</script>
</body>
</html>
