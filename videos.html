<body>
<header class="header"><button class="menu" onclick="openSidebar()" aria-label="فتح القائمة">☰</button><div class="logo"><span class="moon">☾</span> قصص وحكايات الليل</div></header>
<main class="main">
<section class="channel-head"><div class="banner"></div><div class="channelbar"><div class="channel-logo"></div><div class="channel-info"><div class="channel-name">قصص وحكايات الليل</div><div class="subscribers"></div></div></div></section>
<nav class="tabs"><a href="index.html">الرئيسية</a><a class="active" href="videos.html">الفيديوهات</a><a href="shorts.html">Shorts</a><a href="channel-about.html">حول القناة</a></nav>
<section><div class="sort-tabs" aria-label="ترتيب الفيديوهات"><button class="sort-btn active" data-sort="newest">الأحدث</button><button class="sort-btn" data-sort="popular">الرائجة</button><button class="sort-btn" data-sort="oldest">الأقدم</button></div><div class="video-list" id="videoList"></div></section>
</main>
<aside id="sideDrawer" class="side-drawer"><div class="drawer-head"><b>القائمة</b><button onclick="closeSidebar()" aria-label="إغلاق">×</button></div><nav><a href="privacy.html"><span>🔒</span> سياسة الخصوصية</a><a href="terms.html"><span>📜</span> شروط الاستخدام</a><a href="cookies.html"><span>🍪</span> سياسة ملفات الارتباط</a><a href="disclaimer.html"><span>⚠️</span> إخلاء المسؤولية</a><a href="contact.html"><span>📩</span> اتصل بنا</a><a href="admin.html"><span>⚙️</span> لوحة الإدارة</a><a href="about.html"><span>ℹ️</span> عن الموقع</a></nav><div class="drawer-footer">© قصص وحكايات الليل</div></aside><div id="drawerOverlay" class="drawer-overlay" onclick="closeSidebar()"></div>
<script>

function openSidebar(){document.getElementById('sideDrawer')?.classList.add('open');document.getElementById('drawerOverlay')?.classList.add('open');document.body.classList.add('drawer-open')}function closeSidebar(){document.getElementById('sideDrawer')?.classList.remove('open');document.getElementById('drawerOverlay')?.classList.remove('open');document.body.classList.remove('drawer-open')}
const R2_PUBLIC_BASE='https://pub-025c138d90ed4d4bb9d231b4589a28bb.r2.dev';async function fetchCatalog(){const r=await fetch('https://qisas-r2-api.layali-7kayat-719.workers.dev?action=catalog',{cache:'no-store'});if(!r.ok)throw new Error('تعذر تحميل فهرس القصص من R2');return await r.json()};function publicUrl(bucket,path){if(!path)return null;if(String(path).startsWith('r2:'))return R2_PUBLIC_BASE+'/'+String(path).slice(3).split('/').map(encodeURIComponent).join('/');return null}function formatViews(n){return (Number(n)||0).toLocaleString('en-US')+' مشاهدة'}function formatDate(s){const d=new Date(s),diff=Math.max(0,Date.now()-d.getTime()),m=Math.floor(diff/60000),h=Math.floor(m/60),day=Math.floor(h/24);if(m<60)return 'قبل '+Math.max(1,m)+' دقيقة';if(h<24)return 'قبل '+h+' ساعة';if(day<7)return 'قبل '+day+' أيام';if(day<30)return 'قبل '+Math.floor(day/7)+' أسابيع';return 'قبل '+Math.floor(day/30)+' شهر'}
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
let videos=[];function row(v){const img=publicUrl('thumbnails',v.thumbnail_path)||'featured.svg';const vu=publicUrl('videos',v.video_path)||'';return `<div class="video-row"><a href="watch.html?id=${encodeURIComponent(v.id)}" class="thumb-link"><div class="thumb"><img src="${img}" alt=""><span class="duration" data-video-url="${vu}">…</span></div></a><div><a href="watch.html?id=${encodeURIComponent(v.id)}"><div class="vtitle">${esc(v.title)}</div><div class="meta">${formatViews(v.views)} • ${formatDate(v.created_at)}</div></a></div>${actionMenu(v)}</div>`}
function renderVideos(sort='newest'){let list=[...videos];if(sort==='popular')list.sort((a,b)=>(b.views||0)-(a.views||0));else if(sort==='oldest')list.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));else list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const q=new URLSearchParams(location.search).get('q')?.trim().toLowerCase();if(q)list=list.filter(v=>(v.title||'').toLowerCase().includes(q)||(v.description||'').toLowerCase().includes(q));const el=document.getElementById('videoList');el.innerHTML=list.length?list.map(row).join(''):'<div class="meta" style="padding:20px">لا توجد نتائج</div>';fillDurations(el)}
async function load(){const el=document.getElementById('videoList');el.innerHTML='<div class="meta" style="padding:20px">جاري تحميل الفيديوهات...</div>';try{const catalog=await fetchCatalog();videos=(catalog.videos||[]).filter(v=>v.status==='published'&&!v.is_short).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));renderVideos()}catch(error){el.innerHTML='<div class="meta" style="padding:20px">تعذر تحميل الفيديوهات</div>';console.error(error)}}
document.querySelectorAll('.sort-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderVideos(btn.dataset.sort)}));
load();

function toast(text){const old=document.querySelector('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=text;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function openMenu(btn,e){e.preventDefault();e.stopPropagation();document.querySelectorAll('.video-menu.open').forEach(x=>x.classList.remove('open'));btn.parentElement.querySelector('.video-menu').classList.add('open')}
document.addEventListener('click',()=>document.querySelectorAll('.video-menu.open').forEach(x=>x.classList.remove('open')));
function shareItem(id,title,event){
  event?.preventDefault(); event?.stopPropagation();
  const url=new URL('watch.html?id='+encodeURIComponent(id),location.href).href;
  if(navigator.share){navigator.share({title:title||'قصص وحكايات الليل',url}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>toast('تم نسخ رابط الفيديو')).catch(()=>toast('رابط الفيديو: '+url));}
  else toast('رابط الفيديو: '+url);
}
function isAdmin(){return !!sessionStorage.getItem('admin_pin_value')}
function actionMenu(v){const admin=isAdmin();return `<div class="more-wrap"><button class="more" onclick="openMenu(this,event)" aria-label="المزيد">⋮</button><div class="video-menu" onclick="event.stopPropagation()">${admin?`<button onclick="location.href='admin.html?edit=${encodeURIComponent(v.id)}'">✏️ تعديل</button><button class="danger-item" onclick="deleteFromList('${v.id}')">🗑️ حذف</button>`:''}<button onclick="shareItem('${v.id}',${JSON.stringify(v.title||'')},event)">↗ مشاركة الفيديو</button></div></div>`}
async function deleteFromList(id){if(!confirm('هل تريدين حذف هذه القصة نهائيًا؟'))return;const pin=sessionStorage.getItem('admin_pin_value');if(!pin){location.href='admin.html';return}try{const r=await fetch('https://qisas-r2-api.layali-7kayat-719.workers.dev',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin,action:'delete',id})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw new Error(j.error||'تعذر الحذف');toast('تم حذف القصة');location.reload()}catch(e){toast('فشل الحذف: '+e.message)}}
function durationText(sec){if(!isFinite(sec)||sec<=0)return '—';sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function fillDurations(scope=document){scope.querySelectorAll('.duration[data-video-url]').forEach(el=>{const v=document.createElement('video');v.preload='metadata';v.src=el.dataset.videoUrl;v.addEventListener('loadedmetadata',()=>{el.textContent=durationText(v.duration);v.removeAttribute('src');v.load()},{once:true});v.addEventListener('error',()=>{el.textContent='';},{once:true});});}
</script>

<script>
document.addEventListener('contextmenu',function(e){
  if(e.target && e.target.closest && e.target.closest('video')) e.preventDefault();
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey) && (e.key==='s'||e.key==='S') && e.target && e.target.closest && e.target.closest('video')){
    e.preventDefault();
  }
});
document.querySelectorAll('video').forEach(function(v){
  v.setAttribute('controlsList','nodownload noplaybackrate');
  v.setAttribute('disablepictureinpicture','');
  v.addEventListener('contextmenu',function(e){e.preventDefault();});
});

const _videoGuard=new MutationObserver(function(){
  document.querySelectorAll('video').forEach(function(v){
    v.setAttribute('controlsList','nodownload noplaybackrate');
    v.setAttribute('disablepictureinpicture','');
    v.addEventListener('contextmenu',function(e){e.preventDefault();},{once:true});
  });
});
_videoGuard.observe(document.documentElement,{childList:true,subtree:true});
</script>
