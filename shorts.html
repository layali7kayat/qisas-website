<!doctype html>
<html lang="ar" dir="rtl">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8926612269781002" crossorigin="anonymous"></script>
<meta name="description" content="شاهد القصص القصيرة وShorts من قصص وحكايات الليل.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shorts - قصص وحكايات الليل</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:#f1f1f1;font-family:Arial,"Noto Sans Arabic",sans-serif}
a{color:inherit;text-decoration:none}
.header{height:64px;background:#0f0f0f;border-bottom:1px solid #252525;display:flex;align-items:center;gap:18px;padding:0 18px;position:sticky;top:0;z-index:20}
.logo{font-size:21px;font-weight:800;white-space:nowrap}.moon{color:#f5c84b}
.menu{font-size:23px;background:none;border:0;color:white}
.layout{display:flex;max-width:1500px;margin:auto}
.main{flex:1;min-width:0;padding:18px 24px 90px}
.channel{background:#181818;border:1px solid #292929;border-radius:14px;overflow:hidden;margin-bottom:18px}
.banner{height:190px;background:#101010 url("channel-cover.png") center/cover no-repeat}
.channelbar{display:flex;align-items:center;gap:18px;padding:14px 22px}
.channel-logo{width:58px;height:58px;border-radius:50%;background:#222 url("channel-avatar.png") center/cover no-repeat;border:2px solid #e1b83f;flex:none}
.channel-info{flex:1}.channel-name{font-size:20px;font-weight:800}.subscribers{color:#aaa;font-size:15px;font-weight:600}
.tabs{display:flex;gap:30px;border-bottom:1px solid #333;margin-bottom:20px;overflow:auto;white-space:nowrap}
.tabs a{padding:14px 5px;color:#aaa}.tabs a.active{color:#fff;border-bottom:3px solid #fff}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 14px;gap:12px}.sort-tabs{display:flex;gap:8px;flex-wrap:wrap}.sort-btn{border:1px solid #333;background:#222;color:#bbb;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}.sort-btn.active{background:#fff;color:#111;border-color:#fff}
.section-head h2{font-size:23px;margin:0}
.shorts-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.short-card{min-width:0}
.short-thumb{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#172234}
.short-thumb img{width:100%;height:114%;object-fit:cover;object-position:center top}
.short-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center;font-size:21px}
.short-title{font-size:14px;font-weight:700;line-height:1.4;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.short-meta{display:flex;align-items:center;gap:6px;color:#999;font-size:11px;margin-top:6px}.short-related-badge{position:absolute;top:8px;right:8px;background:#000c;color:#fff;padding:4px 7px;border-radius:7px;font-size:9px;font-weight:700;z-index:4}.short-avatar{width:22px;height:22px;border-radius:50%;background:#222 url("channel-avatar.png") center/cover no-repeat;border:1px solid #d8b63e;flex:none}.short-duration{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.88);color:#fff;padding:3px 5px;border-radius:4px;font-size:10px;font-weight:700;line-height:1}
@media(max-width:1000px){.shorts-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:800px){
.header{height:58px;padding:0 10px;gap:10px}.logo{font-size:16px}.main{padding:0 10px 75px}.channel{border-radius:0;border-left:0;border-right:0}.banner{height:150px}
.channelbar{padding:11px 5px}.channel-logo{width:48px;height:48px}.channel-name{font-size:17px}.subscribers{font-size:13px}
.tabs{gap:25px;margin:0 -10px 12px;padding:0 10px}.tabs a{padding:12px 3px}
.section-head{margin:16px 4px 10px;align-items:center;flex-direction:row}.section-head h2{font-size:20px;flex:none}.sort-tabs{width:auto;justify-content:flex-start;flex-wrap:nowrap;gap:6px}.sort-btn{padding:8px 10px;font-size:11px;white-space:nowrap}
.shorts-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 7px;padding:0 3px}.short-thumb{border-radius:7px}.short-title{font-size:11px;line-height:1.35;margin-top:5px}.short-meta{font-size:9px;margin-top:4px;gap:4px}.short-avatar{width:18px;height:18px}.short-duration{bottom:5px;left:5px;font-size:9px;padding:2px 4px}.short-play{width:34px;height:34px;font-size:15px}
}

.short-card{position:relative}
.short-more-wrap{position:absolute;top:8px;left:8px;z-index:8}
.short-more{width:34px;height:34px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:22px;line-height:1;cursor:pointer}
.short-video-menu{position:absolute;top:40px;left:0;min-width:175px;background:#202020;border:1px solid #3b3b3b;border-radius:10px;box-shadow:0 10px 28px #000b;overflow:hidden;display:none;z-index:30}
.short-video-menu.open{display:block}
.short-video-menu button{display:block;width:100%;text-align:right;background:none;border:0;color:#eee;padding:12px 14px;cursor:pointer;font:inherit}
.short-video-menu button:hover{background:#303030}
.short-video-menu .danger-item{color:#ff8d8d}
.short-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#242424;color:#fff;border:1px solid #444;padding:11px 18px;border-radius:10px;z-index:300}.short-more{padding:0;display:grid;place-items:center}.short-more-wrap{direction:ltr}
.short-desc-modal{position:fixed;inset:0;background:#0009;z-index:250;display:none;align-items:center;justify-content:center;padding:20px}.short-desc-modal.open{display:flex}.short-desc-box{width:min(620px,100%);max-height:80vh;overflow:auto;background:#181818;border:1px solid #3a3a3a;border-radius:16px;box-shadow:0 20px 50px #000b;padding:20px}.short-desc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.short-desc-head h3{margin:0;font-size:19px}.short-desc-close{width:36px;height:36px;border:0;border-radius:50%;background:#2a2a2a;color:#fff;font-size:22px;cursor:pointer}.short-desc-date{color:#aaa;font-size:12px;margin-bottom:14px}.short-desc-text{color:#eee;line-height:1.9;white-space:pre-wrap;font-size:15px}.short-desc-empty{color:#aaa}.side-drawer{position:fixed;top:0;right:0;width:330px;max-width:88vw;height:100vh;background:#181818;border-left:1px solid #333;z-index:100;transform:translateX(105%);transition:.25s;padding:0 0 20px;box-shadow:-8px 0 30px #0008}.side-drawer.open{transform:translateX(0)}.drawer-head{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #303030;font-size:19px}.drawer-head button{background:none;border:0;color:#fff;font-size:30px;cursor:pointer}.side-drawer nav{padding:12px}.side-drawer nav a{display:block;padding:15px 14px;border-radius:10px;font-size:16px}.side-drawer nav a:hover{background:#292929}.drawer-footer{position:absolute;bottom:20px;right:20px;left:20px;color:#777;font-size:13px;padding-top:16px;border-top:1px solid #303030}.drawer-overlay{position:fixed;inset:0;background:#0009;z-index:90;opacity:0;pointer-events:none;transition:.25s}.drawer-overlay.open{opacity:1;pointer-events:auto}body.drawer-open{overflow:hidden}
</style>
</head>
<body>
<header class="header">
<button class="menu" onclick="openSidebar()" aria-label="فتح القائمة">☰</button>
<div class="logo"><span class="moon">☾</span> قصص وحكايات الليل</div>

</header>

<main class="main">
<section class="channel">
<div class="banner"></div>
<div class="channelbar">
<div class="channel-logo"></div>
<div class="channel-info"><div class="channel-name">قصص وحكايات الليل</div><div class="subscribers"></div></div>
</div>
</section>

<nav class="tabs">
<a href="index.html">الرئيسية</a>
<a href="videos.html">الفيديوهات</a>
<a class="active" href="shorts.html">Shorts</a>
<a href="channel-about.html">حول القناة</a>
</nav>

<section>
<div class="section-head"><h2>Shorts</h2><div class="sort-tabs" role="tablist" aria-label="ترتيب الـShorts"><button class="sort-btn active" data-sort="newest" type="button">الأحدث</button><button class="sort-btn" data-sort="popular" type="button">الرائجة</button><button class="sort-btn" data-sort="oldest" type="button">الأقدم</button></div></div>
<div class="shorts-grid" id="shortsGrid"><div style="color:#aaa;padding:20px">جاري تحميل الـShorts...</div></div>
</section>
</main>
<div id="shortDescModal" class="short-desc-modal" role="dialog" aria-modal="true" aria-labelledby="shortDescTitle" onclick="closeShortInfo(event)"><div class="short-desc-box" onclick="event.stopPropagation()"><div class="short-desc-head"><h3 id="shortDescTitle">وصف القصة</h3><button class="short-desc-close" type="button" onclick="closeShortInfo()" aria-label="إغلاق">×</button></div><div id="shortDescDate" class="short-desc-date"></div><div id="shortDescText" class="short-desc-text"></div></div></div><aside id="sideDrawer" class="side-drawer" aria-label="القائمة الجانبية"><div class="drawer-head"><b>القائمة</b><button onclick="closeSidebar()" aria-label="إغلاق">×</button></div><nav><a href="index.html">🏠 الرئيسية</a><a href="videos.html">🎬 الفيديوهات</a><a href="shorts.html">Shorts</a><a href="channel-about.html">ℹ️ حول القناة</a><a href="privacy.html">🔒 سياسة الخصوصية</a><a href="terms.html">📜 شروط الاستخدام</a><a href="cookies.html">🍪 سياسة ملفات الارتباط</a><a href="disclaimer.html">⚠️ إخلاء المسؤولية</a><a href="contact.html">📩 اتصل بنا</a><a href="admin.html">⚙️ لوحة الإدارة</a></nav><div class="drawer-footer">© قصص وحكايات الليل</div></aside><div id="drawerOverlay" class="drawer-overlay" onclick="closeSidebar()"></div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>

function openSidebar(){document.getElementById('sideDrawer')?.classList.add('open');document.getElementById('drawerOverlay')?.classList.add('open');document.body.classList.add('drawer-open')}
function closeSidebar(){document.getElementById('sideDrawer')?.classList.remove('open');document.getElementById('drawerOverlay')?.classList.remove('open');document.body.classList.remove('drawer-open')}
const grid=document.getElementById('shortsGrid');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R2_PUBLIC_BASE='https://pub-025c138d90ed4d4bb9d231b4589a28bb.r2.dev';async function fetchCatalog(){const r=await fetch('https://qisas-r2-api.layali-7kayat-719.workers.dev?action=catalog',{cache:'no-store'});if(!r.ok)throw new Error('تعذر تحميل فهرس القصص من R2');return await r.json()};const publicUrl=(bucket,path)=>{if(!path)return '';if(String(path).startsWith('r2:'))return R2_PUBLIC_BASE+'/'+String(path).slice(3).split('/').map(encodeURIComponent).join('/');return null};
function duration(el,url){if(!url)return;const v=document.createElement('video');v.preload='metadata';v.src=url;v.onloadedmetadata=()=>{let s=Math.round(v.duration||0);el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');v.remove()};}
function isAdmin(){return !!sessionStorage.getItem('admin_pin_value')}
function openShortMenu(btn,e){
  e.preventDefault();e.stopPropagation();
  document.querySelectorAll('.short-video-menu.open').forEach(x=>x.classList.remove('open'));
  btn.parentElement.querySelector('.short-video-menu').classList.add('open');
}
function shareShortItem(id,title,e){
  e?.preventDefault();e?.stopPropagation();
  const url=new URL('shorts-viewer.html?id='+encodeURIComponent(id),location.href).href;
  if(navigator.share){navigator.share({title:title||'Shorts',url}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>toastShort('تم نسخ رابط الفيديو')).catch(()=>toastShort('رابط الفيديو: '+url));}
  else toastShort('رابط الفيديو: '+url);
}
function toastShort(text){
  const old=document.querySelector('.short-toast');if(old)old.remove();
  const x=document.createElement('div');x.className='short-toast';x.textContent=text;
  document.body.appendChild(x);setTimeout(()=>x.remove(),2200);
}
function deleteShortItem(id,e){
  e?.preventDefault();e?.stopPropagation();
  const pin=sessionStorage.getItem('admin_pin_value');
  if(!pin){location.href='admin.html';return}
  if(!confirm('هل تريدين حذف هذا الـShort نهائيًا؟'))return;
  fetch('https://qisas-r2-api.layali-7kayat-719.workers.dev',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin,action:'delete',id})}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||'تعذر الحذف');return j}).then(j=>{
    if(!j.success)throw new Error(j.error||'تعذر الحذف');
    location.reload();
  }).catch(err=>toastShort('فشل الحذف: '+err.message));
}
document.addEventListener('click',()=>document.querySelectorAll('.short-video-menu.open').forEach(x=>x.classList.remove('open')));
let shortsData=[];
let shortsSort='newest';
function formatShortDate(value){if(!value)return '';return new Intl.DateTimeFormat('ar-OM',{year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Muscat'}).format(new Date(value));}
function formatViews(n){return (Number(n)||0).toLocaleString('en-US')+' مشاهدة'}
function sortShorts(list){const copy=[...(list||[])];if(shortsSort==='popular')return copy.sort((a,b)=>(Number(b.views)||0)-(Number(a.views)||0));if(shortsSort==='oldest')return copy.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));return copy.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));}
function renderShorts(){
 const data=sortShorts(shortsData);
 if(!data.length){grid.innerHTML='<div style="color:#aaa;padding:20px">لا توجد Shorts منشورة بعد.</div>';return;}
 grid.innerHTML=data.map(v=>{const img=publicUrl('thumbnails',v.thumbnail_path)||'featured.svg';const url=publicUrl('videos',v.video_path);return `<a class="short-card" href="shorts-viewer.html?id=${encodeURIComponent(v.id)}">
<div class="short-more-wrap"><button class="short-more" onclick="openShortMenu(this,event)" aria-label="المزيد">⋮</button>
<div class="short-video-menu" onclick="event.stopPropagation()">
${isAdmin()?`<button onclick="event.preventDefault();event.stopPropagation();location.href='admin.html?edit=${encodeURIComponent(v.id)}'">✏️ تعديل</button><button class="danger-item" onclick="deleteShortItem('${v.id}',event)">🗑️ حذف</button>`:''}
<button onclick="openShortInfo('${v.id}',event)">▤ وصف القصة</button><button onclick="shareShortItem('${v.id}',${JSON.stringify(v.title||'')},event)">↗ مشاركة الفيديو</button>
</div></div>
<div class="short-thumb"><img src="${img}" alt=""><span class="short-duration" data-url="${url}">…</span>${v.related_video_id?'<span class="short-related-badge">قصة كاملة</span>':''}<span class="short-play">▶</span></div>
<div class="short-title">${esc(v.title)}</div><div class="short-meta"><span class="short-avatar"></span><span>${formatViews(v.views)}</span></div></a>`}).join('');
 grid.querySelectorAll('[data-url]').forEach(e=>duration(e,e.dataset.url));
 if(window.lucide)lucide.createIcons();
}
function openShortInfo(id,e){e?.preventDefault();e?.stopPropagation();const v=shortsData.find(x=>String(x.id)===String(id));if(!v)return;document.getElementById('shortDescTitle').textContent=v.title||'وصف القصة';document.getElementById('shortDescDate').textContent='تاريخ الإضافة: '+formatShortDate(v.created_at);document.getElementById('shortDescText').textContent=(v.description||'').trim()||'لا يوجد وصف لهذه القصة.';document.getElementById('shortDescModal').classList.add('open');document.body.classList.add('drawer-open')}
function closeShortInfo(e){if(e&&e.target&&e.target.id!=='shortDescModal'&&e.target.closest('.short-desc-box'))return;document.getElementById('shortDescModal')?.classList.remove('open');document.body.classList.remove('drawer-open')}
async function loadShorts(){try{const catalog=await fetchCatalog();shortsData=(catalog.videos||[]).filter(v=>v.status==='published'&&v.is_short).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));renderShorts()}catch(error){grid.innerHTML='<div style="color:#aaa;padding:20px">تعذر تحميل الـShorts</div>';console.warn(error)}}
document.querySelectorAll('.sort-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.sort-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');shortsSort=btn.dataset.sort;renderShorts()}));
loadShorts();
</script>

<script>
document.addEventListener('contextmenu',function(e){
  if(e.target && e.target.closest && e.target.closest('video')) e.preventDefault();
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey) && (e.key==='s'||e.key==='S') && e.target && e.target.closest && e.target.closest('video')){
    e.preventDefault();
  }
});
document.querySelectorAll('video').forEach(function(v){
  v.setAttribute('controlsList','nodownload noplaybackrate');
  v.setAttribute('disablepictureinpicture','');
  v.addEventListener('contextmenu',function(e){e.preventDefault();});
});

const _videoGuard=new MutationObserver(function(){
  document.querySelectorAll('video').forEach(function(v){
    v.setAttribute('controlsList','nodownload noplaybackrate');
    v.setAttribute('disablepictureinpicture','');
    v.addEventListener('contextmenu',function(e){e.preventDefault();},{once:true});
  });
});
_videoGuard.observe(document.documentElement,{childList:true,subtree:true});
</script>
</body>
</html>
